# Same gate as `npm run check` locally (lint, typecheck, Prettier, unit tests).
# E2E stays local: it needs a production build and system Chrome.
name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
